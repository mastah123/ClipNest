<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipNest</title>
<link rel="stylesheet" href="styles.css">
</head><body>
<div id="app">
<div class="warn" id="warn" hidden role="alert">Browser storage is unavailable (private mode?). Changes will not be saved — export a backup before leaving.</div>
<div id="hd"><header><div class="logo" id="logo"></div><div class="ttl"><h1>ClipNest</h1><p>Your snippets, one tap away.</p></div><button class="ib lg" id="sBtn" aria-label="Search" aria-expanded="false"></button><button class="ib lg" id="bSet" aria-label="Settings"></button></header>
<div class="sr" id="sr"><span id="sIc"></span><input id="q" type="search" placeholder="Search snippets…" aria-label="Search snippets" autocomplete="off"><button class="ib lg" id="qc" aria-label="Clear search" hidden></button></div>
</div>
<section id="top">
<div class="qp"><div><h2>Quick Paste</h2><p>Capture something from your clipboard</p></div><button class="dark" id="bQP"><span id="pIc"></span>Paste</button></div>
</section>
<div class="lh"><h2 id="lt">Your library</h2><div><button class="ib lg" id="bSort" aria-label="Sort"></button><button class="ib lg" id="vT"></button></div></div>
<div id="chips" role="group" aria-label="Filters"></div>
<div id="ctl"></div>
<main id="list" class="grid"></main>
</div>
<datalist id="cats"></datalist>
<dialog id="dlg"></dialog><dialog id="dlg2"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/detect.js"></script>
<script src="js/helpers.js"></script>
<script src="js/form.js"></script>
<script src="js/render.js"></script>
<script src="js/backup.js"></script>
<script src="js/settings.js"></script>
<script src="js/main.js"></script>
</body></html>
